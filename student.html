<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <link rel="stylesheet" href="studStyle.css">
</head>
<body>

<div class="registration-container">
    <h2>Student Registration Form</h2>

    <form action="#" method="post">

        <label>Name:</label>
        <input type="text" name="name" placeholder="Enter your Name" required><br><br>

        <label>Roll No:</label>
        <input type="text" name="rollno" placeholder="Enter your Roll No" required><br><br>

        <label>Course:</label>
       <select>
  <option>Select Course</option>
  <option>CSE</option>
  <option>MCA</option>
  <option>BCA</option>
</select>

        <label>Mobile Number:</label>
        <input type="tel"
               name="mobile"
               placeholder="Enter your Mobile Number"
               pattern="[0-9]{10}"
               maxlength="10"
               required><br>
        <label>Email</label>
        <input type="email" placeholder="Enter your Email"><br>
        <label>Passward</label>
        <input type="password" id="Passward"required><br>
        <label>Confirm Passward</label>
        <input type="password" id="confirm" required><br>
        <label>Gender:</label>
        <div class="gender">
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
        </div><br>

        <label>Branch:</label>
        <div class="branch">
            <label><input type="checkbox" name="branch[]" value="Computer Science">Computer Science</label>
            <label><input type="checkbox" name="branch[]" value=" Electrical"> Electrical</label>
            <label><input type="checkbox" name="branch[]" value="Mechanical"> Mechanical</label>
        </div><br>

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>
